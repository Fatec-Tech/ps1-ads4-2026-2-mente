
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Pacientes</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container py-5">

    <h1 class="mb-4">Cadastro de Pacientes</h1>

    <div id="mensagem"></div>

    <div class="card mb-4">
      <div class="card-body">

        <h2 class="h5 mb-3">Dados do paciente</h2>

        <form id="form-paciente" class="row g-3">

          <input type="hidden" id="id">

          <div class="col-md-4">
            <label for="nome" class="form-label">Nome</label>
            <input
              type="text"
              id="nome"
              class="form-control"
              required
            >
          </div>

          <div class="col-md-4">
            <label for="email" class="form-label">E-mail</label>
            <input
              type="email"
              id="email"
              class="form-control"
              required
            >
          </div>

          <div class="col-md-4">
            <label for="nascimento" class="form-label">
              Data de nascimento
            </label>
            <input
              type="date"
              id="nascimento"
              class="form-control"
              required
            >
          </div>

          <div class="col-12 d-flex gap-2">

            <button
              type="submit"
              id="btn-salvar"
              class="btn btn-primary"
            >
              Salvar
            </button>

            <button
              type="button"
              id="btn-cancelar"
              class="btn btn-outline-secondary d-none"
            >
              Cancelar edição
            </button>

          </div>

        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0">Pacientes cadastrados</h2>

          <span id="total-pacientes" class="badge bg-primary">
            Total: 0
          </span>
        </div>

        <div class="mb-3">
          <label for="buscar-nome" class="form-label">
            Pesquisar paciente
          </label>

          <input
            type="search"
            id="buscar-nome"
            class="form-control"
            placeholder="Digite o nome do paciente"
          >
        </div>

        <p id="carregando" class="text-muted">
          Carregando pacientes...
        </p>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">

            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Data de nascimento</th>
                <th>Ações</th>
              </tr>
            </thead>

            <tbody id="tabela-pacientes"></tbody>

          </table>
        </div>

      </div>
    </div>

  </main>

  <script src="js/app.js"></script>

</body>
</html>
