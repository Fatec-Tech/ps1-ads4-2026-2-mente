<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Pacientes</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container py-5">

    <h1 class="mb-4">Cadastro de Pacientes</h1>

    <!-- Mensagens de sucesso ou erro -->
    <div id="mensagem"></div>

    <!-- Formulário de cadastro e edição -->
    <form id="form-paciente" class="row g-3 mb-5">

      <!-- ID utilizado ao editar um paciente -->
      <input type="hidden" id="id">

      <div class="col-md-4">
        <label for="nome" class="form-label">Nome</label>
        <input
          type="text"
          class="form-control"
          id="nome"
          required
        >
      </div>

      <div class="col-md-4">
        <label for="email" class="form-label">E-mail</label>
        <input
          type="email"
          class="form-control"
          id="email"
          required
        >
      </div>

      <div class="col-md-3">
        <label for="nascimento" class="form-label">
          Data de nascimento
        </label>
        <input
          type="date"
          class="form-control"
          id="nascimento"
          required
        >
      </div>

      <div class="col-md-1 d-flex align-items-end gap-2">
        <button
          type="submit"
          id="btn-salvar"
          class="btn btn-primary"
        >
          Salvar
        </button>
      </div>

      <div class="col-12">
        <button
          type="button"
          id="btn-cancelar"
          class="btn btn-outline-secondary d-none"
        >
          Cancelar edição
        </button>
      </div>
    </form>

    <!-- Listagem -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Pacientes cadastrados</h2>

      <span id="total-pacientes" class="badge bg-primary">
        Total: 0
      </span>
    </div>

    <!-- Pesquisa por nome -->
    <div class="mb-3">
      <label for="buscar-nome" class="form-label">
        Pesquisar paciente
      </label>

      <input
        type="search"
        class="form-control"
        id="buscar-nome"
        placeholder="Digite o nome do paciente"
      >
    </div>

    <!-- Carregamento -->
    <p id="carregando" class="text-muted">
      Carregando pacientes...
    </p>

    <!-- Tabela -->
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Data de nascimento</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="tabela-pacientes"></tbody>
      </table>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>

      <div class="col-md-4">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required>
      </div>

      <div class="col-md-4">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="col-md-3">
        <label for="nascimento" class="form-label">Data de nascimento</label>
        <input type="date" class="form-control" id="nascimento" required>
      </div>

      <div class="col-md-1 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">+</button>
      </div>
    </form>

    <h2 class="h4 mb-3">Pacientes cadastrados</h2>

    <!-- Mensagem de carregamento, visível enquanto os dados não chegam -->
    <p id="carregando" class="text-muted">Carregando pacientes...</p>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Data de nascimento</th>
        </tr>
      </thead>
      <tbody id="tabela-pacientes"></tbody>
    </table>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
